<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Merchant Risk Console{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="topbar">
  <a class="brand" href="{{ url_for('dashboard') }}">
    <span class="brand-mark">◆</span>
    <span class="brand-text">RISK<span class="brand-accent">/CONSOLE</span></span>
  </a>
  <nav class="topnav">
    <a href="{{ url_for('dashboard') }}">Dashboard</a>
    <a href="{{ url_for('add_form') }}" class="btn-add">+ New Merchant</a>
  </nav>
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
